name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: probes/servo/target
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM for Windows
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          $llvmBin = 'C:\Program Files\LLVM\bin'
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Cargo dependencies and Servo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            probes/servo/target
          key: Windows-release-${{ hashFiles('probes/servo/Cargo.lock', 'probes/servo/Cargo.toml', 'crates/draconium-host/Cargo.toml') }}

      - name: Build Servo release
        run: cargo build --release --locked --manifest-path probes/servo/Cargo.toml

      - name: Compute release version
        shell: pwsh
        run: |
          $ref = '${{ github.ref }}'
          if ($ref.StartsWith('refs/tags/')) {
            $version = '${{ github.ref_name }}'
          } else {
            $shortSha = '${{ github.sha }}'.Substring(0, 7)
            $version = "dev-$shortSha"
          }
          "DN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package portable bundle and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleName = "draconium-$env:DN_VERSION-windows-x64"
          $bundleDir = "dist/$bundleName"
          ./scripts/package.ps1 -OutputDir $bundleDir -ExePath probes/servo/target/release/draconium.exe
          $zipPath = "dist/$bundleName.zip"
          Compress-Archive -Path $bundleDir -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $bundleName.zip" | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Starter smoke test (best-effort on headless runner)
        continue-on-error: true
        timeout-minutes: 2
        shell: pwsh
        run: |
          & "dist/draconium-$env:DN_VERSION-windows-x64/draconium.exe" --starter --dn-assets --self-test starter

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: draconium-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  release:
    name: Create draft GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release notes file exists
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes file: $notes" >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: draconium-windows-x64
          path: dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Draconium ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/**/*.zip
            dist/**/SHA256SUMS.txt
          fail_on_unmatched_files: true
